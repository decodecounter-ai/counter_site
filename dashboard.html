<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" style="width: 100%; max-width: 480px;">
        <nav class="navbar">
            <button onclick="showPage('scout')">UPLINK</button>
            <button onclick="showPage('intel')">INTEL</button>
            <button onclick="showPage('records')">DATABASE</button>
            <button onclick="logout()" style="color: #ff4d4d;">EXIT</button>
        </nav>

        <div id="page-scout" class="page card-scout">
            <div class="scout-header">
                <div class="input-group">
                    <label>TEAM ID</label>
                    <input type="number" id="up-target" placeholder="20000">
                </div>
                <div class="input-group">
                    <label>MATCH #</label>
                    <input type="number" id="up-match" value="1">
                </div>
            </div>

            <div class="input-group">
                <label>AUTO POSITION</label>
                <select id="auto-pos-select">
                    <option value="rap">RED - Aproape</option>
                    <option value="rdep">RED - Departe</option>
                    <option value="aap">BLUE - Aproape</option>
                    <option value="adep">BLUE - Departe</option>
                </select>
            </div>

            <div class="counter-card yellow-border">
                <label class="label-yellow">AUTO IN (SCORED)</label>
                <div class="action-row">
                    <button class="btn-main btn-yellow" onclick="updateVal('aS', 1)">+ PIECE</button>
                    <span class="count-val" id="val-aS">0</span>
                    <button class="btn-undo" onclick="updateVal('aS', -1)">-</button>
                </div>
            </div>

            <div class="counter-card red-border">
                <label class="label-red">AUTO MISSED</label>
                <div class="action-row">
                    <button class="btn-main btn-red" onclick="updateVal('aM', 1)">+ MISS</button>
                    <span class="count-val" id="val-aM">0</span>
                    <button class="btn-undo" onclick="updateVal('aM', -1)">-</button>
                </div>
            </div>

            <div class="counter-card green-border">
                <label class="label-green">TELEOP PUNCT</label>
                <div class="action-row">
                    <button class="btn-main btn-green" onclick="updateVal('tS', 1)">+ POINT</button>
                    <span class="count-val" id="val-tS">0</span>
                    <button class="btn-undo" onclick="updateVal('tS', -1)">-</button>
                </div>
            </div>

            <div class="checkbox-card">
                <input type="checkbox" id="up-park">
                <label>ASCENT / PARK SUCCESS (P)</label>
            </div>

            <button onclick="sendData()" class="btn-generate" id="btn-submit">GENERATE REPORT</button>
        </div>

        <div id="success-screen" class="page card hidden">
            <span class="checkmark">✓</span>
            <h2>Report Sent!</h2>
            <button onclick="resetScout()" class="btn-generate">NEW REPORT</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let stats = { aS: 0, aM: 0, tS: 0 };

        function updateVal(key, step) {
            stats[key] = Math.max(0, stats[key] + step);
            document.getElementById('val-' + key).innerText = stats[key];
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(div => div.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
        }

        async function sendData() {
            const target = document.getElementById('up-target').value;
            if(!target) return alert("Enter Team ID!");

            const btn = document.getElementById('btn-submit');
            const pos = document.getElementById('auto-pos-select').value;
            const isParked = document.getElementById('up-park.checked');
            const pSuffix = document.getElementById('up-park').checked ? "(P)" : "";
            
            // Formatul tau x(x+y)(P)
            const autoFormatted = `${stats.aS}(${stats.aS + stats.aM})${pSuffix}`;

            btn.innerText = "UPLINKING...";
            btn.disabled = true;

            const params = new URLSearchParams({
                action: 'uplink',
                myTeam: sessionStorage.getItem('team'),
                myToken: sessionStorage.getItem('token'),
                target: target,
                match: document.getElementById('up-match').value,
                tele: stats.tS,
                park: document.getElementById('up-park').checked ? "YES" : "NO",
                [pos]: autoFormatted
            });

            try {
                await fetch(`${SCRIPT_URL}?${params.toString()}`, { mode: 'no-cors' });
                document.getElementById('page-scout').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
            } catch(e) { alert("Error!"); }
            finally { btn.innerText = "GENERATE REPORT"; btn.disabled = false; }
        }

        function resetScout() {
            stats = { aS: 0, aM: 0, tS: 0 };
            ['aS', 'aM', 'tS'].forEach(k => document.getElementById('val-' + k).innerText = "0");
            document.getElementById('up-target').value = "";
            document.getElementById('success-screen').classList.add('hidden');
            document.getElementById('page-scout').classList.remove('hidden');
        }

        function logout() { sessionStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
