<div id="page-scout" class="page card-scout">
    <div class="scout-header">
        <div class="input-group">
            <label>TEAM ID</label>
            <input type="number" id="up-target" placeholder="20000">
        </div>
        <div class="input-group">
            <label>MATCH #</label>
            <input type="number" id="up-match" value="1">
        </div>
    </div>

    <label>ALLIANCE POSITION</label>
    <select id="up-pos">
        <option value="RED - Aproape">RED - Aproape</option>
        <option value="RED - Departe">RED - Departe</option>
        <option value="BLUE - Aproape">BLUE - Aproape</option>
        <option value="BLUE - Departe">BLUE - Departe</option>
    </select>

    <div class="counter-card yellow-border">
        <label class="label-yellow">AUTO SCORED</label>
        <div class="action-row">
            <button class="btn-main btn-yellow" onclick="updateCounter('auto-s', 1)">+ PIECE</button>
            <span class="count-val" id="auto-s">0</span>
            <button class="btn-undo" onclick="updateCounter('auto-s', -1)">Undo</button>
        </div>
    </div>

    <div class="counter-card red-border">
        <label class="label-red">AUTO MISSED</label>
        <div class="action-row">
            <button class="btn-main btn-red" onclick="updateCounter('auto-m', 1)">+ MISS</button>
            <span class="count-val" id="auto-m">0</span>
            <button class="btn-undo" onclick="updateCounter('auto-m', -1)">Undo</button>
        </div>
    </div>

    <div class="counter-card green-border">
        <label class="label-green">TELEOP PIECES</label>
        <div class="action-row">
            <button class="btn-main btn-green" onclick="updateCounter('tele', 1)">+ PIECE</button>
            <span class="count-val" id="tele">0</span>
            <button class="btn-undo" onclick="updateCounter('tele', -1)">Undo</button>
        </div>
    </div>

    <div class="checkbox-card">
        <input type="checkbox" id="up-park">
        <label>ASCENT / PARK SUCCESS</label>
    </div>

    <label>RP VALUE</label>
    <input type="number" id="up-rp" value="0" class="rp-input">

    <button onclick="sendData()" class="btn-generate" id="btn-submit">GENERATE REPORT</button>
</div>

<div id="success-screen" class="page card hidden" style="text-align:center; padding: 50px 20px;">
    <div class="checkmark">✓</div>
    <h2 style="color:white">Report Sent!</h2>
    <p style="color:#aaa">Data has been uplinked to your sheet.</p>
    <button onclick="resetScout()" class="btn-generate">NEW REPORT</button>
</div>

<script>
function updateCounter(id, val) {
    let el = document.getElementById(id);
    let current = parseInt(el.innerText);
    if(current + val >= 0) el.innerText = current + val;
}

async function sendData() {
    const target = document.getElementById('up-target').value;
    if(!target) return alert("Please enter Team ID");

    const btn = document.getElementById('btn-submit');
    btn.innerText = "UPLINKING...";
    btn.disabled = true;

    const pos = document.getElementById('up-pos').value;
    // Formatare prefix: RED - Aproape -> RED_A
    const prefix = pos.includes("RED") ? (pos.includes("Aproape") ? "RED_A" : "RED_D") : (pos.includes("Aproape") ? "BLUE_A" : "BLUE_D");
    
    // Concatenare Autos pentru Col G
    const fullAutos = `${prefix}-S:${valText('auto-s')}|M:${valText('auto-m')}`;

    const params = new URLSearchParams({
        action: 'uplink',
        myTeam: sessionStorage.getItem('team'),
        myToken: sessionStorage.getItem('token'),
        target: target,
        autoScored: valText('auto-s'),
        autoMissed: valText('auto-m'),
        teleop: valText('tele'),
        rp: document.getElementById('up-rp').value,
        matchNum: document.getElementById('up-match').value,
        fullAutos: fullAutos,
        position: pos,
        park: document.getElementById('up-park').checked ? "YES" : "NO"
    });

    try {
        const res = await fetch(`${SCRIPT_URL}?${params.toString()}`);
        const data = await res.json();
        if(data.success) {
            document.getElementById('page-scout').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    } catch(e) { alert("Connection Error!"); }
    finally { btn.innerText = "GENERATE REPORT"; btn.disabled = false; }
}

function valText(id) { return document.getElementById(id).innerText; }
function resetScout() {
    document.getElementById('auto-s').innerText = "0";
    document.getElementById('auto-m').innerText = "0";
    document.getElementById('tele').innerText = "0";
    document.getElementById('up-target').value = "";
    document.getElementById('up-park').checked = false;
    document.getElementById('success-screen').classList.add('hidden');
    document.getElementById('page-scout').classList.remove('hidden');
}
</script>
