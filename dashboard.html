<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" style="max-width: 800px; width: 95%;">
        <nav class="navbar">
            <button onclick="showPage('scout')">Uplink</button>
            <button onclick="showPage('intel')">Unified Intel</button>
            <button onclick="showPage('records')">My Records</button>
            <button onclick="logout()" style="background:#e63946">Exit</button>
        </nav>

        <div id="page-scout" class="page card">
            <h2>📤 Match Scouting</h2>
            <input type="number" id="up-target" placeholder="Target Team">
            <div class="grid">
                <input type="number" id="up-rap" placeholder="R ap">
                <input type="number" id="up-rdep" placeholder="R dep">
                <input type="number" id="up-aap" placeholder="A ap">
                <input type="number" id="up-adep" placeholder="A dep">
            </div>
            <input type="number" id="up-scor" placeholder="Total Score">
            <input type="text" id="up-autos" placeholder="Auto Sequence (e.g. L,M,R)">
            <button onclick="sendData()" class="btn-login">Submit to Cloud</button>
        </div>

        <div id="page-intel" class="page card hidden">
            <h2>🔍 Deep Intel Search</h2>
            <div class="grid" style="grid-template-columns: 3fr 1fr;">
                <input type="number" id="search-target" placeholder="Team ID">
                <button onclick="runIntel()" class="btn-login" style="margin:8px 0;">Scan</button>
            </div>
            <div id="intel-output"></div>
        </div>

        <div id="page-records" class="page card hidden" style="max-width: 100%;">
            <h2>📋 Your Database</h2>
            <div id="table-view" class="scroll-table"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2s_dMOLrjx6WcZ2aTnrX9yWFJWDz8eqhShtX_dE7oH6wEEDVL2rbVqt-F4Zu7QnMkSA/exec";";
        const team = sessionStorage.getItem('team');
        const token = sessionStorage.getItem('token');

        if(!team || !token) window.location.href = "login.html";

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById('page-' + id).classList.remove('hidden');
            if(id === 'records') loadRecords();
        }

        async function sendData() {
            const p = new URLSearchParams({
                action: 'uplink', myTeam: team, myToken: token,
                target: val('up-target'), rap: val('up-rap'), rdep: val('up-rdep'),
                aap: val('up-aap'), adep: val('up-adep'), scor: val('up-scor'), autos: val('up-autos')
            });
            const res = await fetch(`${SCRIPT_URL}?${p.toString()}`);
            if((await res.json()).success) alert("Data Saved!");
        }

        async function runIntel() {
            const target = val('search-target');
            const res = await fetch(`${SCRIPT_URL}?action=intel&myTeam=${team}&myToken=${token}&target=${target}`);
            const d = await res.json();
            if(d.success) {
                document.getElementById('intel-output').innerHTML = `
                    <div class="stat-item">
                        <p><b>Matches:</b> ${d.stats.count} | <b>Avg Score:</b> ${d.stats.avgScor}</p>
                        <p><b>RAP:</b> ${d.stats.avgRap} | <b>RDEP:</b> ${d.stats.avgRdep}</p>
                        <p><b>Auto Patterns:</b> <br><small>${d.stats.autoHistory}</small></p>
                    </div>`;
            } else alert(d.msg);
        }

        async function loadRecords() {
            const res = await fetch(`${SCRIPT_URL}?action=mydata&myTeam=${team}&myToken=${token}`);
            const d = await res.json();
            if(d.success) {
                let h = '<table>' + d.table.map(r => '<tr>' + r.map(c => `<td>${c}</td>`).join('') + '</tr>').join('') + '</table>';
                document.getElementById('table-view').innerHTML = h;
            }
        }

        function val(id) { return document.getElementById(id).value; }
        function logout() { sessionStorage.clear(); window.location.href = "login.html"; }
    </script>
</body>
</html>
