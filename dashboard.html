<div id="page-scout" class="page card">
    <h2>📤 Match Uplink</h2>
    
    <div class="grid">
        <input type="number" id="up-target" placeholder="Target Team #">
        <select id="up-pos">
            <option value="Red-1">Red 1</option>
            <option value="Red-2">Red 2</option>
            <option value="Blue-1">Blue 1</option>
            <option value="Blue-2">Blue 2</option>
        </select>
    </div>

    <div class="scouting-section">
        <div class="counter-row">
            <span>R ap</span>
            <button onclick="change('up-rap', -1)">-</button>
            <input type="number" id="up-rap" value="0" readonly>
            <button onclick="change('up-rap', 1)">+</button>
        </div>
        <div class="counter-row">
            <span>R dep</span>
            <button onclick="change('up-rdep', -1)">-</button>
            <input type="number" id="up-rdep" value="0" readonly>
            <button onclick="change('up-rdep', 1)">+</button>
        </div>
        <div class="counter-row">
            <span>A ap</span>
            <button onclick="change('up-aap', -1)">-</button>
            <input type="number" id="up-aap" value="0" readonly>
            <button onclick="change('up-aap', 1)">+</button>
        </div>
        <div class="counter-row">
            <span>A dep</span>
            <button onclick="change('up-adep', -1)">-</button>
            <input type="number" id="up-adep" value="0" readonly>
            <button onclick="change('up-adep', 1)">+</button>
        </div>
    </div>

    <input type="number" id="up-scor" placeholder="Final Score">
    <div style="margin: 15px 0; display:flex; align-items:center; gap:10px;">
        <input type="checkbox" id="up-park" style="width:20px; height:20px;">
        <label>Robot Parked?</label>
    </div>

    <button onclick="sendData()" class="btn-login" id="btn-submit">Submit Data</button>
</div>

<div id="success-screen" class="page card hidden" style="text-align:center;">
    <div style="font-size: 80px; color: var(--primary);">✓</div>
    <h3>Data Sent to Database!</h3>
    <button onclick="showPage('scout')" class="btn-login">Back to Scout</button>
</div>

<script>
// Funcția pentru butoanele de +/-
function change(id, val) {
    let el = document.getElementById(id);
    let current = parseInt(el.value) || 0;
    if(current + val >= 0) el.value = current + val;
}

async function sendData() {
    const btn = document.getElementById('btn-submit');
    const target = document.getElementById('up-target').value;
    if(!target) return alert("Enter Target Team!");

    btn.innerText = "Uplinking...";
    btn.disabled = true;

    // Generăm secvența de AUTOS (concatenată cu R/A)
    // Exemplu: "R-ap: 2 | R-dep: 1 | A-ap: 0 | A-dep: 3"
    const autoString = `R:${val('up-rap')}|R:${val('up-rdep')}|A:${val('up-aap')}|A:${val('up-adep')}`;

    const params = new URLSearchParams({
        action: 'uplink',
        myTeam: sessionStorage.getItem('team'),
        myToken: sessionStorage.getItem('token'),
        target: target,
        rap: val('up-rap'),
        rdep: val('up-rdep'),
        aap: val('up-aap'),
        adep: val('up-adep'),
        scor: val('up-scor'),
        autos: autoString,
        position: document.getElementById('up-pos').value,
        park: document.getElementById('up-park').checked ? "YES" : "NO"
    });

    try {
        const res = await fetch(`${SCRIPT_URL}?${params.toString()}`);
        const data = await res.json();
        if(data.success) {
            // Resetăm câmpurile
            document.querySelectorAll('#page-scout input[type="number"]').forEach(i => i.value = (i.id == 'up-target' ? '' : '0'));
            document.getElementById('up-park').checked = false;
            
            // Arătăm bifa draguță
            document.getElementById('page-scout').classList.add('hidden');
            document.getElementById('success-screen').classList.remove('hidden');
        }
    } catch(e) {
        alert("Error sending data!");
    } finally {
        btn.innerText = "Submit Data";
        btn.disabled = false;
    }
}

function val(id) { return document.getElementById(id).value; }
</script>
