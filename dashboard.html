<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app" style="width: 100%; max-width: 480px;">
        <nav class="navbar">
            <button onclick="showPage('scout')">UPLINK</button>
            <button onclick="showPage('intel')">INTEL</button>
            <button onclick="showPage('records')">DATABASE</button>
            <button onclick="logout()" style="color: #ff4d4d;">EXIT</button>
        </nav>

        <div id="page-scout" class="page card-scout">
            <div class="scout-header">
                <div class="input-group">
                    <label>TEAM ID</label>
                    <input type="number" id="up-target" placeholder="20000">
                </div>
                <div class="input-group">
                    <label>MATCH #</label>
                    <input type="number" id="up-match" value="1">
                </div>
            </div>

            <div class="input-group">
                <label>AUTO POSITION (Column Selector)</label>
                <select id="auto-pos-select">
                    <option value="rap">RED - Aproape</option>
                    <option value="rdep">RED - Departe</option>
                    <option value="aap">BLUE - Aproape</option>
                    <option value="adep">BLUE - Departe</option>
                </select>
            </div>

            <div class="counter-card yellow-border">
                <label class="label-yellow">AUTO PIECES</label>
                <div class="action-row">
                    <button class="btn-main btn-yellow" onclick="updateAuto(1, false)">+ PIECE</button>
                    <button class="btn-main btn-red" onclick="updateAuto(1, true)">+ MISS</button>
                    <div class="display-box">
                        <span id="txt-auto">0(0)</span>
                        <button class="btn-undo-mini" onclick="undoAuto()">Undo</button>
                    </div>
                </div>
            </div>

            <div class="counter-card green-border">
                <label class="label-green">TELEOP PIECES</label>
                <div class="action-row">
                    <button class="btn-main btn-green" onclick="updateTele(1)">+ PIECE</button>
                    <span class="count-val" id="txt-tele">0</span>
                    <button class="btn-undo-mini" onclick="updateTele(-1)">Undo</button>
                </div>
            </div>

            <div class="checkbox-card">
                <input type="checkbox" id="up-park">
                <label>ASCENT / PARK SUCCESS (P)</label>
            </div>

            <button onclick="sendData()" class="btn-generate" id="btn-submit">GENERATE REPORT</button>
        </div>

        <div id="success-screen" class="page card hidden">
            <span class="checkmark">✓</span>
            <h2>Report Sent!</h2>
            <p style="color:#888; margin-bottom: 20px;">Data added to your column.</p>
            <button onclick="resetScout()" class="btn-generate">NEW REPORT</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        // --- LOGICA VARIABILE ---
        let autoS = 0, autoM = 0, teleS = 0;

        function updateAuto(val, isMiss) {
            if(isMiss) autoM += val; else autoS += val;
            renderAuto();
        }

        function undoAuto() {
            if(autoS > 0) autoS--; else if(autoM > 0) autoM--;
            renderAuto();
        }

        function renderAuto() {
            document.getElementById('txt-auto').innerText = `${autoS}(${autoS + autoM})`;
        }

        function updateTele(val) {
            teleS = Math.max(0, teleS + val);
            document.getElementById('txt-tele').innerText = teleS;
        }

        function showPage(p) {
            document.querySelectorAll('.page').forEach(div => div.classList.add('hidden'));
            document.getElementById('page-' + p).classList.remove('hidden');
        }

        function logout() { sessionStorage.clear(); window.location.href = "login.html"; }

        // --- TRIMITERE DATE (Logic Dropdown) ---
        async function sendData() {
            const target = document.getElementById('up-target').value;
            if(!target) return alert("Please enter Team ID");

            const btn = document.getElementById('btn-submit');
            const pos = document.getElementById('auto-pos-select').value; // rap, rdep, aap, sau adep
            const isParked = document.getElementById('up-park').checked;
            const pSuffix = isParked ? "(P)" : "";

            btn.innerText = "UPLINKING...";
            btn.disabled = true;

            // Construim valoarea finala x(x+y)(P)
            const autoVal = `${autoS}(${autoS + autoM})${pSuffix}`;

            // Parametrii trimisi catre Apps Script
            const params = new URLSearchParams({
                action: 'uplink',
                myTeam: sessionStorage.getItem('team'),
                myToken: sessionStorage.getItem('token'),
                target: target,
                match: document.getElementById('up-match').value,
                tele: teleS,
                park: isParked ? "YES" : "NO",
                [pos]: autoVal // Aici se alege coloana din Apps Script (B, C, D sau E)
            });

            try {
                // 'no-cors' rezolva eroarea rosie din consola
                await fetch(`${SCRIPT_URL}?${params.toString()}`, {
                    method: 'GET',
                    mode: 'no-cors'
                });
                
                // Fortam afisarea succesului
                document.getElementById('page-scout').classList.add('hidden');
                document.getElementById('success-screen').classList.remove('hidden');
            } catch(e) {
                alert("Connection Error! Check console.");
                console.error(e);
            } finally {
                btn.innerText = "GENERATE REPORT";
                btn.disabled = false;
            }
        }

        function resetScout() {
            autoS = 0; autoM = 0; teleS = 0;
            renderAuto();
            document.getElementById('txt-tele').innerText = "0";
            document.getElementById('up-target').value = "";
            document.getElementById('up-park').checked = false;
            document.getElementById('success-screen').classList.add('hidden');
            document.getElementById('page-scout').classList.remove('hidden');
        }
    </script>
</body>
</html>
