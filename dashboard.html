<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Dashboard v9.0</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Database & Intel Styling */
        #db-content { width: 100%; overflow-x: auto; white-space: nowrap; }
        .db-table { width: 100%; border-collapse: collapse; font-size: 11px; margin-top: 10px; }
        .db-table th, .db-table td { padding: 10px; border: 1px solid #30363d; text-align: center; min-width: 90px; }
        .db-table th { background: #21262d; color: #f1e05a; }

        /* Intel Cards */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 15px 0; }
        .stat-card { background: #1c2128; padding: 12px; border-radius: 8px; border-bottom: 3px solid #30363d; }
        .stat-card label { font-size: 9px; color: #8b949e; text-transform: uppercase; display: block; margin-bottom: 4px; }
        .stat-card div { font-size: 20px; font-weight: bold; color: #f1e05a; }
        
        /* Graph Styling - Fixed Scaling */
        .trend-container { 
            display: flex; align-items: flex-end; gap: 4px; height: 70px; 
            margin-top: 10px; padding: 8px; background: rgba(0,0,0,0.2); border-radius: 6px;
            border: 1px solid #333;
        }
        .trend-bar { 
            flex: 1; background: #238636; border-radius: 2px 2px 0 0; 
            min-width: 12px; transition: height 0.5s ease-out; 
        }
        
        .auto-max-box { background: #0d1117; padding: 8px; border-radius: 6px; font-size: 12px; margin-bottom: 4px; display: flex; justify-content: space-between; border: 1px solid #222; }
        .auto-max-box b { color: #58a6ff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div id="app" style="width: 100%; max-width: 480px;">
        <nav class="navbar">
            <button onclick="showPage('scout')">UPLINK</button>
            <button onclick="showPage('intel')">INTEL</button>
            <button onclick="showPage('records'); fetchDatabase();">DATABASE</button>
            <button onclick="logout()" style="color: #ff4d4d;">EXIT</button>
        </nav>

        <div id="page-scout" class="page">
            <div class="card-scout">
                <div class="scout-header" style="display: flex; gap:10px;">
                    <div class="input-group" style="flex:2">
                        <label>TEAM ID</label>
                        <input type="number" id="up-target" placeholder="Ex: 19121">
                    </div>
                    <div class="input-group" style="flex:1">
                        <label>MATCH #</label>
                        <input type="number" id="up-match" value="1">
                    </div>
                </div>

                <div class="input-group">
                    <label>AUTO POSITION</label>
                    <select id="auto-pos-select">
                        <option value="rap">RED - Aproape (AP)</option>
                        <option value="rdep">RED - Departe (DEP)</option>
                        <option value="aap">BLUE - Aproape (AP)</option>
                        <option value="adep">BLUE - Departe (DEP)</option>
                    </select>
                </div>

                <div class="counter-card yellow-border">
                    <label class="label-yellow">AUTO PIECES SCORRED</label>
                    <div class="action-row">
                        <button class="btn-main btn-yellow" onclick="updateVal('aS', 1)">+ PIECE</button>
                        <span class="count-val" id="val-aS">0</span>
                        <button class="btn-undo" onclick="updateVal('aS', -1)">-</button>
                    </div>
                </div>

                <div class="counter-card red-border">
                    <label class="label-red">AUTO MISSED</label>
                    <div class="action-row">
                        <button class="btn-main btn-red" onclick="updateVal('aM', 1)">+ MISS</button>
                        <span class="count-val" id="val-aM">0</span>
                        <button class="btn-undo" onclick="updateVal('aM', -1)">-</button>
                    </div>
                </div>

                <div class="counter-card green-border">
                    <label class="label-green">TELEOP TOTAL PIECES</label>
                    <div class="action-row">
                        <button class="btn-main btn-green" onclick="updateVal('tS', 1)">+ POINT</button>
                        <span class="count-val" id="val-tS">0</span>
                        <button class="btn-undo" onclick="updateVal('tS', -1)">-</button>
                    </div>
                </div>

                <div class="input-group" style="margin-top: 15px;">
                    <label>RANKING POINTS (RP)</label>
                    <input type="number" id="up-rp" value="0">
                </div>

                <div class="checkbox-card" style="display:flex; align-items:center; gap:10px; margin: 15px 0;">
                    <input type="checkbox" id="up-park" style="width:20px; height:20px;">
                    <label for="up-park">PARK / ASCENT SUCCESS (P)</label>
                </div>

                <button onclick="sendData()" class="btn-generate" id="btn-submit">GENERATE REPORT</button>
            </div>
        </div>

        <div id="page-intel" class="page hidden">
            <div class="card-scout">
                <div class="input-group">
                    <label>SEARCH TEAM DATA</label>
                    <input type="number" id="intel-search" placeholder="Enter Team ID...">
                </div>
                <button onclick="fetchIntel()" class="btn-generate">RUN ANALYTICS</button>
                <div id="intel-results"></div>
            </div>
        </div>

        <div id="page-records" class="page hidden">
            <div class="card-scout"><div id="db-content"></div></div>
        </div>

        <div id="success-screen" class="page hidden" style="text-align:center; padding: 50px 20px;">
            <div style="font-size: 60px; color: #238636;">✓</div>
            <h2 style="color:white;">Uplink Sent!</h2>
            <p style="color:#8b949e">Cloud DB Syncing...</p>
            <p style="margin-top:20px; font-size:14px; color:var(--yellow);">Form reseting in 3s...</p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        let stats = { aS: 0, aM: 0, tS: 0 };

        function updateVal(k, s) { 
            stats[k] = Math.max(0, stats[k]+s); 
            document.getElementById('val-'+k).innerText = stats[k]; 
        }

        function showPage(p) { 
            document.querySelectorAll('.page').forEach(d => d.classList.add('hidden')); 
            const id = p === 'success-screen' ? p : 'page-'+p;
            document.getElementById(id).classList.remove('hidden'); 
        }

        async function sendData() {
            const target = document.getElementById('up-target').value;
            if(!target) return alert("Introdu un Team ID!");
            
            const btn = document.getElementById('btn-submit');
            const pos = document.getElementById('auto-pos-select').value;
            const park = document.getElementById('up-park').checked;
            const rp = document.getElementById('up-rp').value;
            const match = document.getElementById('up-match').value;
            
            // Format auto: scored(total)(P)
            const autoVal = `${stats.aS}(${stats.aS + stats.aM})${park ? "(P)" : ""}`;

            btn.disabled = true; 
            btn.innerText = "UPLINKING...";

            const p = new URLSearchParams({
                action: 'uplink', 
                myTeam: sessionStorage.getItem('team'), 
                myToken: sessionStorage.getItem('token'),
                target: target, 
                match: match,
                auto_type: pos, 
                auto_val: autoVal, 
                tele: stats.tS, 
                rp: rp
            });

            // No-cors fetch asincron
            fetch(`${SCRIPT_URL}?${p.toString()}`, { mode: 'no-cors' });

            // Trimitere vizuală
            setTimeout(() => {
                showPage('success-screen');
                resetScout();
                setTimeout(() => {
                    showPage('scout');
                    btn.disabled = false; 
                    btn.innerText = "GENERATE REPORT";
                }, 3000);
            }, 600);
        }

        function resetScout() {
            stats = { aS: 0, aM: 0, tS: 0 };
            ['aS','aM','tS'].forEach(k => document.getElementById('val-'+k).innerText = "0");
            document.getElementById('up-target').value = "";
            document.getElementById('up-rp').value = "0";
            document.getElementById('up-park').checked = false;
            // Increment Match
            const m = document.getElementById('up-match');
            m.value = parseInt(m.value || 0) + 1;
        }

        async function fetchIntel() {
            const t = document.getElementById('intel-search').value;
            const res = document.getElementById('intel-results');
            if(!t) return;
            
            const p = new URLSearchParams({ 
                action: 'intel', 
                myTeam: sessionStorage.getItem('team'), 
                myToken: sessionStorage.getItem('token'), 
                target: t 
            });
            res.innerHTML = "<p style='margin-top:20px; color:#8b949e;'>Calculating Intelligence...</p>";

            try {
                const r = await fetch(`${SCRIPT_URL}?${p.toString()}`);
                const j = await r.json();
                
                if(j.success) {
                    const d = j.data;
                    // Fix Grafic: Găsim cea mai mare valoare pentru scalare corectă
                    const maxInHistory = Math.max(15, ...d.teleHistory);

                    res.innerHTML = `
                        <div style="margin-top:25px; text-align:left; animation: fadeIn 0.3s;">
                            <h2 style="color:var(--yellow); border-bottom:1px solid #333; padding-bottom:5px;">TEAM ${d.target}</h2>
                            
                            <div class="stat-grid">
                                <div class="stat-card"><label>Avg Teleop</label><div>${d.avgTele}</div></div>
                                <div class="stat-card"><label>Last 3 Avg</label><div>${d.avgLast3}</div></div>
                            </div>

                            <label style="font-size:10px; color:#8b949e;">AUTO PERFORMANCE (MAX)</label>
                            <div class="auto-max-box">Red AP / DEP: <b>${d.maxAuto.rap} / ${d.maxAuto.rdep}</b></div>
                            <div class="auto-max-box">Blue AP / DEP: <b>${d.maxAuto.aap} / ${d.maxAuto.adep}</b></div>

                            <label style="font-size:10px; color:#8b949e; margin-top:20px; display:block;">TELEOP PIECES HISTORY (Trend)</label>
                            <div class="trend-container">
                                ${d.teleHistory.map(v => {
                                    const h = (v / maxInHistory) * 100;
                                    return `<div class="trend-bar" style="height:${h}%;" title="Pieces: ${v}"></div>`;
                                }).join('')}
                            </div>
                            <div style="font-size:9px; color:#555; text-align:center; margin-top:4px;">Newest → ${d.teleHistory.join(' | ')}</div>
                        </div>`;
                } else {
                    res.innerHTML = `<p style="color:#ff4d4d; margin-top:10px;">${j.msg}</p>`;
                }
            } catch(e) { res.innerHTML = "Error loading data."; }
        }

        async function fetchDatabase() {
            const content = document.getElementById('db-content');
            const p = new URLSearchParams({ 
                action: 'mydata', 
                myTeam: sessionStorage.getItem('team'), 
                myToken: sessionStorage.getItem('token') 
            });
            content.innerHTML = "Connecting to Cloud...";
            try {
                const r = await fetch(`${SCRIPT_URL}?${p.toString()}`);
                const j = await r.json();
                if(j.success) {
                    let h = '<table class="db-table"><tr>';
                    j.table[0].forEach(cell => h += `<th>${cell}</th>`);
                    h += '</tr>';
                    for(let i=1; i<j.table.length; i++){
                        h += '<tr>';
                        j.table[i].forEach((c, idx) => {
                            // Formatare Timestamp (Coloana 9)
                            if(idx === 8 && c) c = new Date(c).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                            h += `<td>${c}</td>`;
                        });
                        h += '</tr>';
                    }
                    content.innerHTML = h + '</table>';
                }
            } catch(e) { content.innerHTML = "Connection timeout."; }
        }

        function logout() { sessionStorage.clear(); window.location.href="login.html"; }
    </script>
</body>
</html>
