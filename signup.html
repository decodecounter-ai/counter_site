<script src="config.js"></script>
<script>
    function handleSignup() {
        const id = document.getElementById('team-id').value;
        const email = document.getElementById('email-id').value;
        if(!id || !email) return alert("Fill all fields!");

        // Aceasta este magia JSONP:
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?action=register&teamId=${id}&email=${email}&callback=signupCallback`;
        document.body.appendChild(script);
        
        // Ștergem scriptul după ce se încarcă pentru a păstra pagina curată
        script.onload = () => document.body.removeChild(script);
    }

    // Funcția care primește datele
    function signupCallback(data) {
        if(data.success) {
            alert("Success! Check your email.");
            window.location.href = "login.html";
        } else {
            alert("Error: " + data.msg);
        }
    }
</script>
