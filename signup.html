<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DECODE</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { background-color: #0d1117; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .auth-card { background: #161b22; padding: 40px; border-radius: 12px; width: 100%; max-width: 360px; text-align: center; }
        .auth-card h1 { color: #f1e05a; margin-bottom: 5px; font-size: 24px; }
        .auth-card p { color: #8b949e; margin-bottom: 25px; font-size: 14px; }
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { color: #8b949e; font-size: 11px; text-transform: uppercase; display: block; margin-bottom: 8px; }
        .input-group input { width: 100%; padding: 12px; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; box-sizing: border-box; }
        .btn-reg { width: 100%; padding: 14px; background: #4e7d43; border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; text-transform: uppercase; }
        #msg { margin-top: 15px; font-size: 13px; color: #ff7b72; }
        .footer-link { margin-top: 25px; font-size: 13px; color: #8b949e; }
        .footer-link a { color: #58a6ff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Create Account</h1>
        <p>Join the scouting network</p>
        <div class="input-group">
            <label>Team Number</label>
            <input type="number" id="team" placeholder="Ex: 35000">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="nume@gmail.com">
        </div>
        <button onclick="handleSignup()" id="btn-signup" class="btn-reg">Register</button>
        <div id="msg"></div>
        <div class="footer-link">Already have an account? <a href="login.html">Sign In</a></div>
    </div>

    <script src="config.js"></script>
    <script>
        async function handleSignup() {
            const team = document.getElementById('team').value;
            const email = document.getElementById('email').value;
            const msg = document.getElementById('msg');
            if(!team || !email) { msg.innerText = "Completează toate câmpurile!"; return; }

            msg.style.color = "#8b949e";
            msg.innerText = "Se procesează...";

            try {
                // Trimitem cererea către Apps Script cu parametrii corecți
                const url = `${SCRIPT_URL}?action=signup&team=${team}&email=${email}`;
                const response = await fetch(url);
                const data = await response.json();

                if(data.success) {
                    msg.style.color = "#7ee787";
                    msg.innerText = "Succes! Token-ul a fost trimis pe mail.";
                    setTimeout(() => window.location.href = "login.html", 3000);
                } else {
                    msg.style.color = "#ff7b72";
                    msg.innerText = data.msg;
                }
            } catch (e) {
                msg.innerText = "Eroare de conexiune (verifică SCRIPT_URL)";
            }
        }
    </script>
</body>
</html>
