<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 class="logo">DECODE <span>Portal</span></h1>
        <h2>Create Account</h2>
        <input type="number" id="team-id" placeholder="Team Number (e.g. 17962)">
        <input type="email" id="email-id" placeholder="Official Email Address">
        <button onclick="handleSignup()" class="btn-signup">Create Account</button>
        <p>Already have a token? <a href="login.html">Login here</a></p>
    </div>

    <script src="config.js"></script>
    <script>
        async function handleSignup() {
            const id = document.getElementById('team-id').value;
            const email = document.getElementById('email-id').value;
            const btn = document.querySelector('button');
            
            if(!id || !email) return alert("Please fill in both fields.");
            
            btn.innerText = "Processing...";
            btn.disabled = true;

            try {
                // Folosim SCRIPT_URL definit in config.js
                const response = await fetch(`${SCRIPT_URL}?action=register&teamId=${id}&email=${email}`);
                const data = await response.json();
                
                if(data.success) {
                    alert("Account created! Check your email for the token.");
                    window.location.href = "login.html";
                } else {
                    alert("Error: " + data.msg);
                }
            } catch(e) {
                console.error(e);
                alert("Connection Error! Make sure your Script is deployed as 'Anyone'.");
            } finally {
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
