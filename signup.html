<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 class="logo">DECODE <span>Portal</span></h1>
        <h2>Create Account</h2>
        <input type="number" id="team-id" placeholder="Team Number (ex: 17962)">
        <input type="email" id="email-id" placeholder="Official Email">
        <button onclick="handleSignup()" id="signup-btn">Create Account</button>
        <p>Already have a token? <a href="login.html" style="color:#76c893">Login here</a></p>
    </div>

    <script src="config.js"></script>
    <script>
        function handleSignup() {
            const id = document.getElementById('team-id').value;
            const email = document.getElementById('email-id').value;
            const btn = document.getElementById('signup-btn');

            if(!id || !email) return alert("Please fill both fields!");

            btn.innerText = "Processing...";
            btn.disabled = true;

            // Tehnica JSONP: Cream un script tag care cheama URL-ul Google
            const script = document.createElement('script');
            script.src = `${SCRIPT_URL}?action=register&teamId=${id}&email=${email}&callback=signupCallback`;
            document.body.appendChild(script);

            // Stergem scriptul dupa ce primim raspunsul pentru curatenie
            script.onload = () => document.body.removeChild(script);
            script.onerror = () => {
                alert("Connection Error. Check your SCRIPT_URL in config.js");
                btn.innerText = "Create Account";
                btn.disabled = false;
            };
        }

        // Aceasta functie este executata de Google Script
        function signupCallback(data) {
            const btn = document.getElementById('signup-btn');
            if(data.success) {
                alert("Account created successfully! Check your email for the token.");
                window.location.href = "login.html";
            } else {
                alert("Error: " + data.msg);
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
