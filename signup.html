<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - DECODE</title>
    <style>
        body { 
            background-color: #0d1117; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; 
        }
        .auth-card { 
            background: #161b22; 
            padding: 40px; 
            border-radius: 12px; 
            width: 100%; 
            max-width: 360px; 
            text-align: center; 
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .auth-card h1 { color: #f1e05a; margin-bottom: 5px; font-size: 24px; }
        .auth-card p { color: #8b949e; margin-bottom: 25px; font-size: 14px; }
        
        .input-group { text-align: left; margin-bottom: 20px; }
        .input-group label { 
            color: #8b949e; 
            font-size: 11px; 
            text-transform: uppercase; 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600;
        }
        .input-group input { 
            width: 100%; 
            padding: 12px; 
            background: #0d1117; 
            border: 1px solid #30363d; 
            border-radius: 6px; 
            color: white; 
            box-sizing: border-box; 
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: #58a6ff;
            outline: none;
        }

        .btn-reg { 
            width: 100%; 
            padding: 14px; 
            background: #238636; 
            border: 1px solid rgba(240,246,252,0.1); 
            border-radius: 6px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 14px; 
            text-transform: uppercase;
            transition: background 0.2s;
        }
        .btn-reg:hover { background: #2ea043; }
        .btn-reg:disabled { background: #23863680; cursor: not-allowed; }

        #msg { 
            margin-top: 20px; 
            font-size: 13px; 
            min-height: 1.2em;
            line-height: 1.4;
        }
        .footer-link { margin-top: 25px; font-size: 13px; color: #8b949e; }
        .footer-link a { color: #58a6ff; text-decoration: none; font-weight: 500; }
        .footer-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Create Account</h1>
        <p>Join the DECODE scouting network</p>
        
        <div class="input-group">
            <label>Team Number</label>
            <input type="number" id="team" placeholder="Ex: 35000" required>
        </div>
        
        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="nume@gmail.com" required>
        </div>
        
        <button onclick="handleSignup()" id="btn-signup" class="btn-reg">Register</button>
        
        <div id="msg"></div>
        
        <div class="footer-link">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        async function handleSignup() {
            const teamInput = document.getElementById('team');
            const emailInput = document.getElementById('email');
            const btn = document.getElementById('btn-signup');
            const msg = document.getElementById('msg');

            const team = teamInput.value.trim();
            const email = emailInput.value.trim();

            // Validare simplă
            if(!team || !email) { 
                msg.style.color = "#ff7b72";
                msg.innerText = "Te rugăm să completezi toate câmpurile!"; 
                return; 
            }

            // UI feedback
            msg.style.color = "#8b949e";
            msg.innerText = "Se procesează solicitarea...";
            btn.disabled = true;

            try {
                // Construim URL-ul folosind parametrul 'action=signup'
                // Folosim encodeURIComponent pentru siguranța datelor transmise
                const url = `${SCRIPT_URL}?action=signup&team=${encodeURIComponent(team)}&email=${encodeURIComponent(email)}`;
                
                const response = await fetch(url);
                const data = await response.json();

                if(data.success) {
                    msg.style.color = "#7ee787";
                    msg.innerText = "Succes! Verifică adresa de email pentru token.";
                    
                    // Curățăm câmpurile
                    teamInput.value = "";
                    emailInput.value = "";
                    
                    // Redirecționare după 3 secunde
                    setTimeout(() => {
                        window.location.href = "login.html";
                    }, 3500);
                } else {
                    msg.style.color = "#ff7b72";
                    msg.innerText = data.msg || "Eroare la înregistrare.";
                    btn.disabled = false;
                }
            } catch (e) {
                console.error("Signup Error:", e);
                msg.style.color = "#ff7b72";
                msg.innerText = "Eroare de conexiune. Verifică SCRIPT_URL în config.js";
                btn.disabled = false;
            }
        }

        // Permite trimiterea formularului la apăsarea tastei Enter
        document.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                handleSignup();
            }
        });
    </script>
</body>
</html>
