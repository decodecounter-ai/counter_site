<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DECODE - Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 class="logo">DECODE <span>Portal</span></h1>
        <h2>Create Account</h2>
        <input type="number" id="team-id" placeholder="Team Number (e.g. 17962)">
        <input type="email" id="email-id" placeholder="Official Email">
        <button onclick="handleSignup()" id="btn-signup">Create Account</button>
        <p>Already have a token? <a href="login.html" style="color:#76c893">Login here</a></p>
    </div>

    <script src="config.js"></script>
    <script>
        async function handleSignup() {
            const id = document.getElementById('team-id').value;
            const email = document.getElementById('email-id').value;
            const btn = document.getElementById('btn-signup');

            if(!id || !email) return alert("Please fill both fields.");

            btn.innerText = "Processing...";
            btn.disabled = true;

            const url = `${SCRIPT_URL}?action=register&teamId=${id}&email=${email}`;
            console.log("Trimitere cerere Signup către:", url);

            try {
                const response = await fetch(url);
                const data = await response.json();
                console.log("Răspuns primit:", data);

                if(data.success) {
                    alert("Account created! Check your email for the token.");
                    window.location.href = "login.html";
                } else {
                    alert("Error: " + data.msg);
                }
            } catch(e) {
                console.error("EROARE LA SIGNUP:", e);
                alert("Connection Error! Verifică consola (F12).");
            } finally {
                btn.innerText = "Create Account";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
