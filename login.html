<script src="config.js"></script>
<script>
    function handleLogin() {
        const id = document.getElementById('team-id').value;
        const tk = document.getElementById('token-id').value;
        
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?action=login&teamId=${id}&token=${tk}&callback=loginCallback`;
        document.body.appendChild(script);
        script.onload = () => document.body.removeChild(script);
    }

    function loginCallback(data) {
        if(data.success) {
            sessionStorage.setItem('team', document.getElementById('team-id').value);
            sessionStorage.setItem('token', document.getElementById('token-id').value);
            window.location.href = "dashboard.html";
        } else {
            alert("Invalid credentials!");
        }
    }
</script>
